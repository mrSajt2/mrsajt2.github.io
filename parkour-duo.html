<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parkour Duó</title>
<style>
:root{color-scheme:dark;--bg:#12142a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg)}
body{display:flex;align-items:center;justify-content:center;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif}
#wrap{position:relative;width:100%;max-width:min(100vw,calc((100vh - 8px) * 16 / 9));aspect-ratio:16/9}
canvas{width:100%;height:100%;display:block;background:#1b1f3b}
[hidden]{display:none!important}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0b1af0;color:#fff;font-size:clamp(11px,1.9vw,18px)}
#ui>div{display:flex;flex-direction:column;gap:.8em;align-items:center;width:min(90%,26em);text-align:center}
h1{margin:0 0 .3em;font-size:2.6em;font-weight:800}
button,input{font:inherit;border-radius:.6em;border:2px solid #ffffff30;background:#1d2145;color:#fff;padding:.7em 1em;width:100%;box-sizing:border-box}
button{cursor:pointer;font-weight:700}button:hover{background:#2a3070}
button.pri{background:#ff7a45;border-color:#ff7a45;color:#1b1030}button.pri:hover{background:#ff9166}
.row{display:flex;gap:.6em;width:100%}.row button{width:auto}
.code{font-size:3em;font-weight:800;letter-spacing:.15em;color:#ffd166}
.slot{display:flex;justify-content:space-between;width:100%;box-sizing:border-box;padding:.55em .9em;border-radius:.6em;background:#ffffff12;border-left:.5em solid var(--c,#555);text-align:left}
.err{color:#ff8fa3;min-height:1.2em}small{color:#b9b6d6}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540" tabindex="0"></canvas>
<div id="ui">
 <div id="p-mode"><h1>Parkour Duó</h1><button class="pri" id="b-local">👥 2 játékos egy gépen</button><button id="b-online">🌐 Online multiplayer (max. 4 fő)</button><small>Esc: vissza erre a képernyőre</small></div>
 <div id="p-online" hidden><h1>Online</h1><input id="i-name" maxlength="12" placeholder="Becenév"><button class="pri" id="b-create">Szoba létrehozása</button>
  <div class="row"><input id="i-code" maxlength="4" placeholder="Szobakód" style="text-transform:uppercase"><button id="b-join">Csatlakozás</button></div>
  <div class="err" id="err"></div><button id="b-back">Vissza</button></div>
 <div id="p-room" hidden><small>Szobakód (oszd meg a barátaiddal)</small><div class="code" id="room-code"></div><div id="slots" style="width:100%;display:flex;flex-direction:column;gap:.4em"></div>
  <button class="pri" id="b-start">Indítás</button><small id="wait"></small><button id="b-leave">Kilépés</button></div>
</div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=960,H=540,WIN=3;
const G=1900,SPEED=280,JUMP=-650,FONT='"Avenir Next","Helvetica Neue",Arial,sans-serif';
// Pályagenerátor: 10 témájú pálya, mindegyiknek más a hangulata és a fő akadálya
let cams=[0,0],WORLD,FLAG,solids,movers,spikes,cps,boxes,blocks,traps,pads,shots=[],saws=[],turrets=[],tbul=[],rings=[],theme=0,cls=0,stl=0,lvl=0;
// téma: ég (3 szín), platform, platform teteje, városkép
const T=[['#1b1f3b','#6b3560','#d9654f','#141629','#8f86c4','#2a1f45'],['#050816','#101a3d','#274472','#0a0f24','#5fa8ff','#0b1230'],
['#f2a65a','#f7c97e','#fde9b8','#6b3f1d','#e8b06a','#b9733a'],['#3b6ea5','#8fc5e8','#e5f6ff','#2c4a6b','#d8f1ff','#5d89b5'],
['#1f3d2b','#3f7a4a','#a8d08d','#1e2a1b','#7bcf6a','#2c5535'],['#2a0a0a','#7a1f0f','#ff7a2e','#1a0c0c','#ff9a4d','#3a1410'],
['#10002b','#3c096c','#ff2e97','#0d0221','#00f5d4','#240046'],['#05445e','#189ab4','#75e6da','#042b3b','#d4f1f4','#0a5c7a'],
['#1c1f26','#3a4352','#7a8696','#12151b','#a9b7c9','#2a303b'],['#2d1b4e','#c2527a','#ffd89b','#1a1030','#ffd1a1','#4a2a63']];
const TN=['Alkony','Éjszaka','Sivatag','Jég','Erdő','Láva','Neon','Óceán','Vihar','Hajnal'];
const ITEMS=['slow','rev','frz','block','trap','turbo','fog','heavy','shake','swap'];
function rng(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296;}
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let SEED=Math.floor(Math.random()*1e6);
const act=sp=>!sp.cyc||((t+sp.ph)%2.4)<1.2; // időzített tüskék: 1,2 mp fent, 1,2 mp lent
const CN=['Könnyű','Normál','Nehéz'];
const SN=['Vegyes','Magas','Mély','Akadályfutam','Légi'];
const BG=[0,0,2,1,3,1,0,2,1,2]; // háttér stílusa témánként: 0 város, 1 hegyek, 2 dombok, 3 fák
function load(n){
 const r=rng(((SEED+n*7919)*2654435761)>>>0);for(let k=0;k<5;k++)r();
 theme=Math.floor(r()*10);const o0=r();
 cls=n==0?0:o0<0.3?0:o0<0.72?1:2; // könnyű / normál / nehéz pálya
 stl=n==0?0:Math.floor(r()*5);     // pályastílus: vegyes / magas / mély / akadályfutam / légi
 const d=cl(Math.min(n,12)+(cls-1)*3,0,14),minD=[350,800,1500][cls],ge=stl==4?1e9:stl==3?2:[3,4,5][cls];
 const vlo=stl==2?330:150,vhi=stl==1?330:470;
 solids=[[0,440,420,100]];movers=[];spikes=[];saws=[];turrets=[];tbul=[];rings=[];cps=[[0,60,440]];boxes=[];blocks=[];traps=[];pads=[];shots=[];
 let x=420,y=440,cnt=0,lastCp=0;const len=(2600+d*260)*(0.8+r()*0.5),g=1+Math.min(3,d>>2),pref=Math.floor(r()*11);
 // ellenőrzőpont csak akkor kerül a pályára, ha elég messze van az előzőtől (nehéz pályán ez nagyon messze van)
 const addCp=(a,b,c)=>{if(a-lastCp>=minD){cps.push([a,b,c]);lastCp=a;}};
 const P=(px,py,w,h,cr)=>{const q=[px,py,w,h||18];if(cr){q.cr=1;q.tm=-1;q.gone=0;}solids.push(q);return q;};
 const cp=q=>addCp(q[0],q[0]+q[2]/2-13,q[1]);
 // új magasság: a stílus sávjában marad, de egyszerre legfeljebb 60 px-t emelkedik (ennyit tud az ugrás)
 const nY=(v,lo)=>Math.max(cl(v,Math.max(lo||150,vlo),vhi),y-60);
 // ágyú: balra lő, alacsonyan (át kell ugrani) vagy magasan (le kell guggolni)
 const mkTurret=(tx,fl)=>{const q=[tx,fl-40,40,40];q.turret=1;solids.push(q);turrets.push({x:tx,fl,per:2.4,tm:0,ph:r()*2.4,next:0});};
 // típusok: 0 ugrás, 1 lépcső, 2 trambulin, 3 oszlopok, 4 omló, 5 mozgó platform, 6 guggolós alagút, 7 magas ugrás,
 //          8 ritmusfutam (ugrás/guggolás váltakozva), 9 felvonó, 10 fűrészmező
 const av=[1,d>=1,d>=1,d>=2,d>=3,d>=2,d>=1,d>=2,d>=1,d>=3,d>=2],pool=[];
 const SW=[[],[7,2,9,1],[8,6,10,0],[8,10,6],[5,9,4,3,2]][stl];
 av.forEach((v,k)=>{if(v){const w=1+(k==0?1:0)+(SW.includes(k)?3:0)+(k==pref?2:0);for(let j=0;j<w;j++)pool.push(k);}});
 while(x<len){cnt++;
  if(d>=3&&cnt==1&&r()<0.4){
   solids.push([x,440,240,100],[x+90,160,24,200],[x+210,100,24,340],[x+234,100,260,18]);
   addCp(x+234,x+250,100);x+=494;y=100;
  }else if(cnt%ge==0){
   // akadálypálya: minden helyen véletlen akadály
   const gx=x+60+r()*40,gy=nY(y+r()*80-40,170),w=260+g*150;
   solids.push([gx,gy,w,H-gy+60]);addCp(gx,gx+20,gy);
   for(let k=0;k<g;k++){const sx=gx+100+k*150,o=d==0?0:r();
    if(o<0.18)spikes.push([sx,gy-16,60,16]);
    else if(o<0.34){const sp=[sx,gy-16,60,16];sp.cyc=1;sp.ph=r()*2.4;spikes.push(sp);}
    else if(o<0.5&&d>=2)saws.push({x:sx+30,y:gy-70,by:gy-70,amp:30,ph:r()*6,sp:1.6+r()*0.8,r:16});
    else if(o<0.64){const c=[sx,gy-150,100,120];c.ceil=1;solids.push(c);}
    else if(o<0.82&&d>=1)mkTurret(sx+30,gy);
    else solids.push([sx+15,gy-44,30,44]);}
   x=gx+w;y=gy;
  }else{
   const t=pool[Math.floor(r()*pool.length)];
   if(t==1){const up=y>260;for(let j=0,k=3+(r()*2|0);j<k;j++){const ny=nY(y+(up?-40:40));P(x+55,ny,90);x+=145;y=ny;}cp(solids[solids.length-1]);}
   else if(t==2){const px=x+60+r()*30,ny=Math.max(150,y-200),nx=px+240;P(px,y,150);pads.push([px+55,y-10,40,10]);cp(P(nx,ny,140));x=nx+140;y=ny;}
   else if(t==3){for(let j=0;j<3;j++){const ny=nY(y+r()*100-50,170),px=x+60+r()*30;P(px,ny,56,H-ny+60);x=px+56;y=ny;}cp(solids[solids.length-1]);}
   else if(t==4){for(let j=0;j<3;j++){const ny=nY(y+r()*60-30),px=x+60+r()*30;P(px,ny,100,18,1);x=px+100;y=ny;}}
   else if(t==5){
    const rg=120+Math.min(d,5)*8,m=[x+20,y,90,18];m.base=x+20;m.range=rg;m.ph=r()*3;m.dx=0;movers.push(m);
    const px=x+20+rg+90+25,w=120+r()*60;cp(P(px,y,w));x=px+w;
   }else if(t==7){
    // magas ugrás: ha fent vagyunk, előbb lemegyünk, aztán a nagy (rózsaszín) trambulin ~300 px-t dob fel
    if(y<400){P(x+70,450,170);y=450;x+=240;}
    const px=x+60+r()*20,ny=Math.max(150,y-290),nx=px+220;
    P(px,y,150);const pd=[px+55,y-10,40,10];pd.big=1;pads.push(pd);cp(P(nx,ny,150));x=nx+150;y=ny;
   }else if(t==6){
    // guggolós alagút: a plafon alatt csak guggolva lehet átmenni
    const px=x+70,w=380;P(px,y,w,H-y+60);const c=[px+70,y-150,240,120];c.ceil=1;solids.push(c);x=px+w;
   }else if(t==8){
    // ritmusfutam: hosszú pálya, rajta váltakozva fal (ugrás), plafon (guggolás) és tüske
    const m=4+(d>>2),px=x+70,w=100+m*170;P(px,y,w,H-y+60);addCp(px,px+20,y);
    for(let j=0;j<m;j++){const sx=px+90+j*170,o=r();
     if(o<0.4)solids.push([sx+20,y-44,30,44]);
     else if(o<0.65){const c=[sx,y-150,100,120];c.ceil=1;solids.push(c);}
     else{const sp=[sx,y-16,60,16];if(d>=3&&o>0.85){sp.cyc=1;sp.ph=r()*2.4;}spikes.push(sp);}}
    x=px+w;
   }else if(t==9&&y>=300){
    // felvonó: függőlegesen járó platform visz fel a következő, magasabb platformra
    const px=x+50,rg=Math.min(140,y-150),L=[px,y,90,18];L.vert=1;L.by=y;L.range=rg;L.ph=r()*3;L.dy=0;L.top=y-rg;movers.push(L);
    const nx=px+150,ny=y-rg+20;cp(P(nx,ny,150));x=nx+150;y=ny;
   }else if(t==10){
    // fűrészmező: egymás után több fűrész, eltérő ütemben
    const m=3+(d>>3),px=x+70,w=140+m*130;P(px,y,w,H-y+60);addCp(px,px+20,y);
    for(let j=0;j<m;j++)saws.push({x:px+130+j*130,y:y-70,by:y-70,amp:30,ph:j*2.1+r(),sp:1.8+r()*0.6,r:16});
    x=px+w;
   }else{
    const dy=y<250?30+r()*40:r()*100-40,ny=nY(y+dy);
    let gap=Math.min(135,65+r()*(25+d*6));if(ny<y-20)gap=Math.min(gap,90);
    let w=Math.max(64,130-d*6+r()*40);const tt=d>=3&&w>=100&&r()<0.2;if(tt)w=200;P(x+gap,ny,w);if(tt)mkTurret(x+gap+80,ny);if(!tt&&cnt%[1,3,4][cls]==0)addCp(x+gap,x+gap+w/2-13,ny);x+=gap+w;y=ny;
   }}}
 const fy=Math.min(y,460),fx=x+80;solids.push([fx,fy,380,H-fy+60]);FLAG=fx+260;WORLD=fx+420;
 // pályánként pontosan 3 véletlen-doboz: a pálya negyedénél, felénél és háromnegyedénél
 for(const f of [0.25,0.5,0.75]){let best=null,bd=1e9;
  for(const q of solids){const c=q[0]+q[2]/2;if(!q.cr&&!q.ceil&&q[2]>=70&&q[0]>300&&q[0]+q[2]<FLAG-200&&Math.abs(c-FLAG*f)<bd&&!boxes.some(b=>Math.abs(b.x-(c-14))<5)){bd=Math.abs(c-FLAG*f);best=q;}}
  if(best)boxes.push({x:best[0]+best[2]/2-14,y:best[1]-52,t:0});}
}
const IN={slow:'Lassítás',rev:'Fordított irányítás',frz:'Fagyasztás',block:'Blokk',trap:'Tüskecsapda',turbo:'Turbó',fog:'Köd',heavy:'Nehéz láb',shake:'Remegés',swap:'Helycsere'};
const FN={slow:'Lassítva',rev:'Fordított irányítás',frz:'Lefagyva',turbo:'Turbó',fog:'Köd',heavy:'Nehéz láb',shake:'Remegő kép'};
function target(i){if(!online)return ps[1-i];const p=ps[i],ot=ps.filter(q=>q!==p);if(!ot.length)return null;
 return ot.filter(q=>q.x>p.x).sort((a,b)=>a.x-b.x)[0]||ot[Math.random()*ot.length|0];} // online: a közvetlenül előtted lévő játékos a célpont
function giveFx(o,k,d){if(o.remote)netEvent({t:'fx',to:o.uid,k,d});else o.fx[k]=d;}
const pickItem=()=>{const a=online?ITEMS.filter(z=>z!='swap'):ITEMS;return a[Math.random()*a.length|0];};
function applyItem(i,it){const p=ps[i],o=it=='turbo'?p:target(i);
 if(!o){p.msg='Nincs kit megszivatni';p.mt=2;return;}
 p.msg=it=='turbo'?'Turbó, 4 mp!':it=='swap'?'Helycsere!':IN[it]+' → '+(online?o.name:'ellenfél')+'!';p.mt=2.5;
 const D={slow:5,rev:5,frz:1.6,fog:5,heavy:6,shake:5};
 if(it=='turbo')p.fx.turbo=4;else if(D[it])giveFx(o,it,D[it]);else if(it=='swap')swap(p,o);
 else{const a=it=='block'?[o.x+100,o.gy-44,44,44]:[o.x+100,o.gy-16,50,16];a.ttl=9;
  for(let k=0;k<4&&it=='block'&&ps.some(q=>hit(q,a));k++)a[0]+=50;
  (it=='block'?blocks:traps).push(a);if(online)netEvent({t:it,a:a.slice(0,4)});}}
function swap(p,o){const bp=p.y+p.h,bo=o.y+o.h,px=p.x,ox=o.x;
 p.x=ox;o.x=px;p.y=bo-p.h;o.y=bp-o.h;p.vy=o.vy=0;
 if(all().some(q=>hit(p,q)||hit(o,q))){p.x=px;o.x=ox;p.y=bp-p.h;o.y=bo-o.h;p.msg='Csere sikertelen';return;}
 rings.push({x:p.x+13,y:p.y+p.h/2,t:0.7},{x:o.x+13,y:o.y+o.h/2,t:0.7});}
function shoot(i){const p=ps[i];if(p.cd>0||p.fx.frz>0)return;p.cd=0.6;const q={x:p.x+p.w/2,y:p.y+14,vx:p.face*560,ttl:1.1,s:p.slot,c:col[p.slot]};shots.push(q);if(online)netEvent({t:'shot',x:q.x,y:q.y,vx:q.vx});}
function tickWorld(dt){
 for(const sw of saws)sw.y=sw.by+Math.sin(t*sw.sp+sw.ph)*sw.amp;
 // ágyúk: a közös óra (t) alapján lőnek, így online minden gépen ugyanakkor és ugyanoda
 const hb=(k,x)=>((Math.imul(k+7,2654435761)^Math.imul(Math.floor(x)+3,40503))>>>7)&1;
 for(const tu of turrets){if(t<0)continue;const u=(t+tu.ph)/tu.per,k=Math.floor(u);tu.tm=(1-(u-k))*tu.per;tu.next=hb(k+1,tu.x);
  if(tu.k===undefined)tu.k=k;else if(k!==tu.k){tu.k=k;tbul.push({x:tu.x-14,y:hb(k,tu.x)?tu.fl-34:tu.fl-16,w:14,h:8,vx:-340,tr:0});}}
 for(let k=tbul.length-1;k>=0;k--){const b=tbul[k];b.x+=b.vx*dt;b.tr+=dt;let dead=b.tr>2.2;
  if(!dead)for(const q of all())if(b.x<q[0]+q[2]&&b.x+b.w>q[0]&&b.y<q[1]+q[3]&&b.y+b.h>q[1]){dead=true;break;}
  if(dead)tbul.splice(k,1);}
 for(let k=rings.length-1;k>=0;k--){rings[k].t-=dt;if(rings[k].t<=0)rings.splice(k,1);}
 for(let k=shots.length-1;k>=0;k--){const b=shots[k];b.x+=b.vx*dt;b.ttl-=dt;let dead=b.ttl<=0;const r=[b.x-6,b.y-6,12,12];
  if(!dead)for(const q of all())if(r[0]<q[0]+q[2]&&r[0]+12>q[0]&&r[1]<q[1]+q[3]&&r[1]+12>q[1]){dead=true;break;}
  if(!dead)for(const q of ps){if(q.slot===b.s||(online&&q.remote))continue;if(hit(q,r)){q.vx=Math.sign(b.vx)*340;q.vy=-190;q.lock=0.25;q.ground=null;dead=true;break;}}
  if(dead)shots.splice(k,1);}
 for(const q of solids)if(q.cr){
  if(q.gone>0){q.gone-=dt;continue;}
  if(q.tm>=0){q.tm-=dt;if(q.tm<0){q.gone=3;q.tm=-1;}}
  else if(ps.some(p=>p.ground===q))q.tm=0.5;}
 for(const b of boxes)if(b.t>0)b.t-=dt;
 for(const a of [blocks,traps])for(let k=a.length-1;k>=0;k--){a[k].ttl-=dt;if(a[k].ttl<=0)a.splice(k,1);}
}
const keys={},jp={};
function clearKeys(){for(const k in keys)keys[k]=0;}
addEventListener('blur',clearKeys);
document.addEventListener('visibilitychange',clearKeys);
addEventListener('keydown',e=>{if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault();
 if(e.metaKey){clearKeys();return;} // macOS: Cmd mellett a keyup nem érkezik meg, ezért ragadna a gomb
 if(!e.repeat)jp[e.code]=1;keys[e.code]=1;});
addEventListener('keyup',e=>{keys[e.code]=0;});
cv.addEventListener('blur',clearKeys);
const ctl=[{l:'KeyA',r:'KeyD',j:'KeyW',u:'KeyQ',d:'KeyS'},{l:'ArrowLeft',r:'ArrowRight',j:'ArrowUp',u:'Enter',d:'ArrowDown'}];
const K=(a,o)=>Array.isArray(a)?a.some(z=>o[z]):o[a];
const CTLO={l:['KeyA','ArrowLeft'],r:['KeyD','ArrowRight'],j:['KeyW','ArrowUp','Space'],u:['KeyQ','Enter'],d:['KeyS','ArrowDown']}; // online: egy játékos, mindkét kiosztás él
const col=['#ff7a45','#22d3c0','#ffd166','#c77dff'],names=['1. játékos','2. játékos','3. játékos','4. játékos'];
let ps=[],score=[0,0,0,0],state='mode',winner=-1,t=0,time=0,online=false,me=0,meta=null;
function mk(i){return{x:40+i*40,y:380,w:26,h:38,vx:0,vy:0,ground:null,coyote:0,buf:0,wall:0,lock:0,cp:0,face:1,flash:0,slot:i,crouch:false,item:null,cd:0,mt:0,msg:'',fx:{slow:0,rev:0,frz:0,turbo:0,fog:0,heavy:0,shake:0},gy:440}}
function reset(){load(lvl);ps=online?netPlayers():[mk(0),mk(1)];cams=[0,0,0,0];time=0;t=0;winner=-1;}
reset();

  const [ap,au,db]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-database.js')]);
  const app=ap.initializeApp(FIREBASE_CONFIG),auth=au.getAuth(app);
  await au.signInAnonymously(auth);
  FB={...db,db:db.getDatabase(app),uid:auth.currentUser.uid};
 }
 if(!offsOn){offsOn=true;FB.onValue(FB.ref(FB.db,'.info/serverTimeOffset'),sn=>{offs=sn.val()||0;});}
 return FB;
}
async function createRoom(name){
 await fbInit();
 let code,ok=false;
 for(let k=0;k<8&&!ok;k++){code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');
  ok=!(await FB.get(FB.ref(FB.db,'rooms/'+code+'/meta'))).exists();}
 if(!ok)throw new Error('Nem sikerült szabad szobakódot találni.');
 const up={};up['rooms/'+code+'/meta']={host:FB.uid,seed:Math.floor(Math.random()*1e6),status:'lobby',lvl:0,startAt:0};
 up['rooms/'+code+'/slots/0']=FB.uid;up['rooms/'+code+'/players/'+FB.uid]={name,slot:0,score:0};
 await FB.update(FB.ref(FB.db),up);
 enterRoom(code,0,true);
}
async function joinRoom(code,name){
 if(code.length!=4)throw new Error('A szobakód 4 karakter.');
 await fbInit();room=code;
 const m=await FB.get(R('meta'));
 if(!m.exists())throw new Error('Nincs ilyen szoba.');
 if(m.val().status!=='lobby')throw new Error('A játék már elindult ebben a szobában.');
 let slot=-1;
 for(let q=0;q<4&&slot<0;q++){const r=await FB.runTransaction(R('slots/'+q),cur=>cur?undefined:FB.uid);if(r.committed)slot=q;}
 if(slot<0)throw new Error('A szoba tele van (legfeljebb 4 fő).');
 await FB.set(R('players/'+FB.uid),{name,slot,score:0});
 enterRoom(code,slot,false);
}
function enterRoom(code,slot,host){
 room=code;mySlot=slot;roster={};meta=null;evStart=sNow();
 if(host)FB.onDisconnect(R('')).remove();
 else{FB.onDisconnect(R('slots/'+slot)).remove();FB.onDisconnect(R('players/'+FB.uid)).remove();FB.onDisconnect(R('states/'+FB.uid)).remove();}
 unsubs=[FB.onValue(R('meta'),onMeta),FB.onValue(R('players'),onPlayers),FB.onChildAdded(R('states'),onState),FB.onChildChanged(R('states'),onState),
  FB.onChildAdded(R('events'),onEvent),FB.onValue(R('win'),onWin)];
 $('room-code').textContent=code;show('room');renderRoom();
}
function leaveRoom(msg){
 for(const u of unsubs){try{u();}catch(e){}}unsubs=[];clearTimeout(advTimer);
 if(FB&&room){try{if(meta&&meta.host===FB.uid)FB.remove(R(''));else{FB.remove(R('slots/'+mySlot));FB.remove(R('players/'+FB.uid));FB.remove(R('states/'+FB.uid));}}catch(e){}}
 room=null;meta=null;roster={};online=false;VW=W/2;state='mode';lvl=0;SEED=Math.floor(Math.random()*1e6);reset();
 if(msg){$('err').textContent=msg;show('online');}else show('mode');
}
function onMeta(sn){
 const m=sn.val();meta=m;
 if(!m){if(room)leaveRoom('A szoba megszűnt (a házigazda kilépett).');return;}
 if(m.status=='play'&&(!online||m.startAt!==startAt))startRound(m);
 renderRoom();
}
function startRound(m){
 online=true;SEED=m.seed;lvl=m.lvl;startAt=m.startAt;VW=W;clearTimeout(advTimer);
 reset();state='play';show(null);
}
function onPlayers(sn){
 roster=sn.val()||{};for(const u in roster)score[roster[u].slot]=roster[u].score|0;
 if(online&&ps.length){const keep=ps.filter(q=>roster[q.uid]);if(keep.length!==ps.length){const mp=ps[me];ps=keep;me=Math.max(0,ps.indexOf(mp));}}
 renderRoom();
}
function netPlayers(){
 const arr=Object.entries(roster).sort((a,b)=>a[1].slot-b[1].slot);
 const out=arr.map(([u,r])=>{const q=mk(r.slot);q.uid=u;q.name=r.name;q.remote=u!==FB.uid;q.tx=q.x;q.ty=q.y;return q;});
 me=Math.max(0,out.findIndex(q=>!q.remote));return out;
}
function netSend(){
 const q=ps[me];if(!q||!room)return;
 FB.set(R('states/'+FB.uid),{x:Math.round(q.x),y:Math.round(q.y),f:q.face,h:q.h,c:q.crouch?1:0,cp:q.cp,gy:Math.round(q.gy),fl:q.flash>0.5?1:0,l:lvl});
}
function onState(sn){
 const u=sn.key,d=sn.val();if(!d||!online||u===(FB&&FB.uid))return;
 const q=ps.find(z=>z.uid===u);if(!q||d.l!==lvl)return;
 q.tx=d.x;q.ty=d.y;q.face=d.f;q.h=d.h;q.crouch=!!d.c;q.cp=d.cp;q.gy=d.gy;
 if(d.fl&&!(q.flash>0))q.flash=0.5;
 if(Math.abs(q.x-q.tx)>300||Math.abs(q.y-q.ty)>300){q.x=q.tx;q.y=q.ty;}
}
function netRemote(dt){for(const q of ps)if(q.remote){const k=Math.min(1,dt*14);q.x+=(q.tx-q.x)*k;q.y+=(q.ty-q.y)*k;if(q.flash>0)q.flash-=dt;}}
function netEvent(e){if(room&&FB)FB.push(R('events'),{...e,from:FB.uid,s:mySlot,ts:FB.serverTimestamp()});}
function onEvent(sn){
 const e=sn.val();if(!e||!online||e.from===FB.uid)return;
 if(e.ts&&e.ts<evStart-2000)return;
 if(e.t=='fx'){const q=ps[me];if(e.to===FB.uid&&q){q.fx[e.k]=e.d;q.msg='Megszivattak: '+IN[e.k];q.mt=2.5;}}
 else if(e.t=='block'||e.t=='trap'){const a=Array.from({length:4},(_,k)=>e.a[k]);a.ttl=9;(e.t=='block'?blocks:traps).push(a);}
 else if(e.t=='shot')shots.push({x:e.x,y:e.y,vx:e.vx,ttl:1.1,s:e.s,c:col[e.s]});
}
async function netFinish(){
 const q=ps[me];if(q.fin)return;q.fin=true;
 const r=await FB.runTransaction(R('win/'+lvl),cur=>cur?undefined:{uid:FB.uid,t:sNow()});
 if(r.committed)FB.set(R('players/'+FB.uid+'/score'),(score[mySlot]|0)+1);
}
function onWin(sn){
 const w=sn.val()||{},e=w[lvl];
 if(e&&online&&state=='play'){
  winner=ps.findIndex(q=>q.uid===e.uid);state='round';
  if(meta&&meta.host===FB.uid){clearTimeout(advTimer);advTimer=setTimeout(()=>{if(room)FB.update(R('meta'),{lvl:lvl+1,startAt:sNow()+3500});},4000);}
 }
}
function hudOnline(){
 const q=ps[me];if(!q)return;ctx.textBaseline='top';ctx.textAlign='left';
 ctx.font='700 15px '+FONT;ctx.fillStyle=q.cd>0?'#ffffff80':'#ffd166';ctx.fillText('Q / Enter: lövés',14,14);
 const ef=Object.keys(q.fx).filter(k=>q.fx[k]>0).map(k=>FN[k]+' '+q.fx[k].toFixed(1)).join(', ');
 ctx.fillStyle='#ff8fa3';if(ef)ctx.fillText(ef,14,34);
 if(q.mt>0){ctx.fillStyle='#ffd166';ctx.fillText('★ '+q.msg,14,54);}
 ctx.textAlign='right';
 [...ps].sort((a,b)=>b.x-a.x).forEach((z,k)=>{ctx.fillStyle=col[z.slot];ctx.fillText((k+1)+'. '+z.name+'  '+(score[z.slot]|0)+' gy.  '+Math.round(Math.min(1,z.x/FLAG)*100)+'%',W-14,14+k*20);});
}
function overlayOnline(){
 ctx.fillStyle='#0a0b1acc';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='alphabetic';
 const w=ps[winner];ctx.fillStyle=w?col[w.slot]:'#fff';ctx.font='800 54px '+FONT;ctx.fillText((w?w.name:'?')+' nyerte a kört!',W/2,190);
 ctx.font='700 24px '+FONT;
 [...ps].sort((a,b)=>(score[b.slot]|0)-(score[a.slot]|0)).forEach((z,k)=>{ctx.fillStyle=col[z.slot];ctx.fillText(z.name+': '+(score[z.slot]|0)+' győzelem',W/2,250+k*34);});
 ctx.fillStyle='#d8d4f0';ctx.font='500 18px '+FONT;ctx.fillText('A következő pálya hamarosan indul…',W/2,430);
}
function renderRoom(){
 if(!room)return;const box=$('slots');box.textContent='';
 for(let q=0;q<4;q++){const e=Object.entries(roster).find(([u,r])=>r.slot===q),d=document.createElement('div');
  d.className='slot';d.style.setProperty('--c',col[q]);
  const a=document.createElement('span'),b=document.createElement('span');
  a.textContent=e?e[1].name+(meta&&meta.host===e[0]?' 👑':''):'üres hely';b.textContent=e&&FB&&e[0]===FB.uid?'te':'';
  d.append(a,b);box.append(d);}
 const host=!!(meta&&FB&&meta.host===FB.uid);$('b-start').hidden=!host;$('wait').textContent=host?'':'Várakozás a házigazdára…';
}
function startGame(){if(meta&&FB&&meta.host===FB.uid)FB.update(R('meta'),{status:'play',lvl:0,startAt:sNow()+3500});}
const nm=()=>($('i-name').value.trim()||'Játékos').slice(0,12);
async function doNet(f){$('err').textContent='';try{await f();}catch(e){room=null;$('err').textContent=e.message||String(e);}}
function startLocal(){online=false;SEED=Math.floor(Math.random()*1e6);VW=W/2;lvl=0;score=[0,0,0,0];reset();state='menu';show(null);}
$('b-local').onclick=startLocal;
$('b-online').onclick=()=>{$('err').textContent='';show('online');};
$('b-back').onclick=()=>show('mode');
$('b-create').onclick=()=>doNet(()=>createRoom(nm()));
$('b-join').onclick=()=>doNet(()=>joinRoom($('i-code').value.trim().toUpperCase(),nm()));
$('b-start').onclick=startGame;
$('b-leave').onclick=()=>leaveRoom();
try{$('i-name').value=localStorage.getItem('pdName')||'';}catch(e){}
$('i-name').onchange=()=>{try{localStorage.setItem('pdName',$('i-name').value);}catch(e){}};
addEventListener('keydown',e=>{if(e.code=='Escape'){if(room)leaveRoom();else{online=false;state='mode';VW=W/2;show('mode');}}});
show('mode');
let last=performance.now(),acc=0;
function loop(n){acc+=Math.min(0.1,(n-last)/1000);last=n;
 while(acc>=1/120){update(1/120);for(const k in jp)jp[k]=0;acc-=1/120;}
 draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);cv.focus();
</script>
